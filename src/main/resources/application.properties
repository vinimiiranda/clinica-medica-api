spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vollmed_api?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.error.include-stacktrace=never

# Segredo usado para assinar os tokens JWT. Defina JWT_SECRET no ambiente.
api.security.token.secret=${JWT_SECRET:troque-este-segredo-em-producao}
